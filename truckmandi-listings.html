<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Mandi — Gaadi Listing</title> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#F2A900;
    --charcoal:#1F2421;
    --cream:#FBF8F2;
    --diesel:#2F4538;
    --rust:#B33A1E;
    --steel:#6B6F72;
    --line:#E4DFD3;
    --card-bg:#FFFFFF;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--charcoal);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.price-tag,.stat-num{
    font-family:'Barlow Condensed',sans-serif;
  }
  a{color:inherit;}

  /* ===== Top bar ===== */
  header.topbar{
    background:var(--charcoal);
    color:var(--cream);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:4px solid var(--yellow);
    position:sticky;
    top:0;
    z-index:50;
  }
  .brand{
    font-weight:800;
    font-size:26px;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:10px;
    line-height:1;
  }
  .brand img{
    height:40px;
    width:40px;
    object-fit:contain;
    flex-shrink:0;
  }
  .brand-text{display:flex; flex-direction:column; gap:2px;}
  .brand-text .name{display:flex; align-items:baseline; gap:6px;}
  .brand span{color:var(--yellow);}
  .brand small{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12px;
    color:var(--steel);
    display:block;
  }
  .topbar-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .topbar-meta{
    font-size:13px;
    color:var(--cream);
    opacity:0.75;
    font-weight:500;
  }
  .support-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--rust);
    color:#fff;
    text-decoration:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:7px 12px;
    border-radius:var(--radius);
    white-space:nowrap;
  }
  .support-btn:hover{filter:brightness(1.08);}

  .result-line{
    max-width:1180px;
    margin:0 auto 4px;
    font-size:13px;
    color:var(--steel);
    font-weight:500;
  }

  /* ===== Grid ===== */
  main{max-width:1180px; margin:0 auto; padding:20px;}
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:16px;
    margin-top:14px;
  }
  .card{
    background:var(--card-bg);
    border:1.5px solid var(--charcoal);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-3px);}
  .card:focus-visible{outline:3px solid var(--yellow); outline-offset:2px;}
  .card-img-wrap{
    width:100%;
    aspect-ratio:4/3;
    background:var(--line);
    position:relative;
    overflow:hidden;
  }
  .card-img-wrap img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .card-img-wrap::after{
    content:attr(data-count);
    position:absolute;
    bottom:6px; right:6px;
    background:rgba(31,36,33,0.85);
    color:var(--cream);
    font-size:11px;
    font-weight:600;
    padding:2px 7px;
    border-radius:var(--radius);
  }
  .card-body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:5px; flex:1;}
  .card-title{
    font-size:16px;
    font-weight:600;
    line-height:1.25;
    color:var(--charcoal);
  }
  .card-meta{
    font-size:12.5px;
    color:var(--steel);
    font-weight:500;
  }
  .card-bottom{
    margin-top:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-top:6px;
  }
  .price-tag{
    font-size:20px;
    font-weight:700;
    color:var(--diesel);
  }
  .loc-tag{
    font-size:11.5px;
    font-weight:600;
    color:var(--rust);
    border:1px solid var(--rust);
    padding:2px 7px;
    border-radius:var(--radius);
  }

  /* ===== States ===== */
  .empty-state, .loading-state, .error-state{
    text-align:center;
    padding:60px 20px;
    color:var(--steel);
  }
  .empty-state h3, .error-state h3{color:var(--charcoal); font-size:22px; margin-bottom:6px;}
  .spinner{
    width:28px; height:28px;
    border:3px solid var(--line);
    border-top-color:var(--yellow);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin:0 auto 14px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== Pagination ===== */
  .pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    margin:28px 0 10px;
  }
  .pagination button{
    font-family:'Inter',sans-serif;
    min-width:36px;
    height:36px;
    padding:0 10px;
    border:1.5px solid var(--charcoal);
    background:var(--card-bg);
    border-radius:var(--radius);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .pagination button.active{
    background:var(--charcoal);
    color:var(--yellow);
  }
  .pagination button:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .pagination button:not(:disabled):hover{border-color:var(--rust);}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0;
    background:rgba(31,36,33,0.72);
    display:none;
    align-items:flex-start;
    justify-content:center;
    z-index:100;
    padding:20px 12px;
    overflow-y:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--cream);
    max-width:760px;
    width:100%;
    margin-top:20px;
    border-radius:var(--radius);
    overflow:hidden;
    border:2px solid var(--charcoal);
  }
  .modal-close{
    position:absolute;
    top:10px; right:14px;
    background:var(--charcoal);
    color:var(--yellow);
    border:none;
    width:34px; height:34px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    z-index:5;
  }
  .modal-header{position:relative;}
  .gallery{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    background:var(--line);
  }
  .gallery img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .gallery-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    background:rgba(31,36,33,0.7);
    color:var(--cream);
    border:none;
    width:38px; height:38px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
  }
  .gallery-nav.prev{left:10px;}
  .gallery-nav.next{right:10px;}
  .gallery-dots{
    position:absolute; bottom:10px; left:0; right:0;
    display:flex; justify-content:center; gap:5px;
  }
  .gallery-dots span{
    width:7px; height:7px; border-radius:50%;
    background:rgba(255,255,255,0.55);
  }
  .gallery-dots span.active{background:var(--yellow);}
  .modal-body{padding:18px 20px 22px;}
  .modal-title{font-size:26px; font-weight:700; margin:0 0 6px;}
  .modal-price{font-size:24px; font-weight:700; color:var(--diesel); margin-bottom:12px;}
  .modal-tags{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .modal-tags span{
    font-size:12.5px; font-weight:600;
    border:1px solid var(--steel);
    color:var(--charcoal);
    padding:4px 10px;
    border-radius:var(--radius);
  }
  .modal-desc{
    font-size:14.5px; line-height:1.6; color:#3a3f3c;
    border-top:1px solid var(--line);
    padding-top:14px;
    margin-bottom:18px;
    white-space:pre-wrap;
  }
  .seller-box{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    margin-bottom:16px;
    gap:10px;
    flex-wrap:wrap;
  }
  .seller-name{font-weight:600; font-size:14.5px;}
  .seller-label{font-size:11.5px; color:var(--steel); font-weight:500;}
  .cta-row{display:flex; gap:10px; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:11px 18px;
    border-radius:var(--radius);
    font-weight:700;
    font-size:14.5px;
    text-decoration:none;
    cursor:pointer;
    border:none;
    flex:1 1 auto;
    justify-content:center;
  }
  .btn-call{background:var(--rust); color:#fff;}
  .btn-wa{background:var(--diesel); color:#fff;}
  .btn:hover{filter:brightness(1.08);}

  @media (max-width:520px){
    .brand{font-size:19px;}
    .brand img{height:32px; width:32px;}
    .brand-text small{display:none;}
    header.topbar{padding:10px 14px;}
    .support-btn{font-size:12px; padding:6px 9px;}
    .topbar-meta{font-size:11px;}
    .modal{margin-top:0;}
  }
</style>
</head>

let allListings = [];

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\r'){ /* skip */ }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

function driveToDirectImage(url){
  if (!url) return url;
  url = url.trim();
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m && m[1] && url.includes("drive.google.com")){
    return "https://lh3.googleusercontent.com/d/" + m[1];
  }
  return url;
}

function toNumber(v){
  if (!v) return 0;
  const n = parseFloat(String(v).replace(/[^0-9.]/g,""));
  return isNaN(n) ? 0 : n;
}

  try{
    if (SHEET_CSV_URL && SHEET_CSV_URL.trim() && !SHEET_CSV_URL.includes("PASTE_YOUR")){
      const res = await fetch(SHEET_CSV_URL, {cache:"no-store"});
      if (!res.ok) throw new Error("fetch failed");
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error("empty sheet");
      const headers = rows[0].map(h => h.trim());
      const idx = {};
      Object.keys(COLUMN_MAP).forEach(key => {
        idx[key] = headers.indexOf(COLUMN_MAP[key]);
      });

      allListings = rows.slice(1).map((r, i) => {
        const get = key => idx[key] > -1 ? (r[idx[key]] || "").trim() : "";
        const imagesRaw = get("images");
        const images = imagesRaw
          ? imagesRaw.split(",").map(s => driveToDirectImage(s.trim())).filter(Boolean)
          : [];
        return {
          id: i,
          title: get("title") || "Vehicle Listing",
          brand: get("brand"),
          type: get("type") || "Other",
          year: get("year"),
          km: get("km"),
          price: toNumber(get("price")),
          priceDisplay: get("price"),
          location: get("location") || "N/A",
          sellerName: get("sellerName") || "Truck Mandi Seller",
          phone: get("phone").replace(/[^0-9+]/g,""),
          images: images.length ? images : ["https://placehold.co/600x450/1F2421/F2A900?text=Truck+Mandi"],
          description: get("description"),
          timestamp: get("timestamp")
        };
      }).filter(l => l.title);
    } else {
      // Embedded real seller data (no Google Sheet configured yet)
      allListings = EMBEDDED_LISTINGS.map(l => ({
        ...l,
        images: l.images && l.images.length ? l.images : ["https://placehold.co/600x450/1F2421/F2A900?text=Truck+Mandi"]
      }));
    }

    filteredListings = [...allListings].sort((a,b) => b.id - a.id);
    currentPage = 1;
    renderGrid();
  } catch(err){
    console.error(err);
    document.getElementById("loadingState").style.display = "none";
    document.getElementById("errorState").style.display = "block";
  }
}

function renderGrid(){
  const loadingEl = document.getElementById("loadingState");
  const errorEl = document.getElementById("errorState");
  const emptyEl = document.getElementById("emptyState");
  const gridEl = document.getElementById("grid");
  loadingEl.style.display = "none";
  errorEl.style.display = "none";

  document.getElementById("totalCount").textContent = allListings.length + " listings live";

  if (filteredListings.length === 0){
    emptyEl.style.display = "block";
    gridEl.style.display = "none";
    document.getElementById("resultLine").textContent = "";
    document.getElementById("pagination").innerHTML = "";
    return;
  }
  emptyEl.style.display = "none";
  gridEl.style.display = "grid";

  const totalPages = Math.max(1, Math.ceil(filteredListings.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = filteredListings.slice(start, start + PAGE_SIZE);

  document.getElementById("resultLine").textContent =
    `${filteredListings.length} gaadi mili — page ${currentPage} of ${totalPages}`;

  gridEl.innerHTML = pageItems.map(l => `
    <div class="card" tabindex="0" data-id="${l.id}">
      <div class="card-img-wrap" data-count="${l.images.length} photo${l.images.length>1?'s':''}">
        <img src="${escapeHtml(l.images[0])}" alt="${escapeHtml(l.title)}" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}';">
      </div>
      <div class="card-body">
        <div class="card-title">${escapeHtml(l.title)}</div>
        <div class="card-meta">${[l.year, l.km ? l.km+' km' : ''].filter(Boolean).join(' • ')}</div>
        <div class="card-bottom">
          <div class="price-tag">₹${l.priceDisplay ? escapeHtml(l.priceDisplay) : 'Call for price'}</div>
          <div class="loc-tag">${escapeHtml(l.location)}</div>
        </div>
      </div>
    </div>
  `).join("");

  gridEl.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openModal(Number(card.dataset.id)));
    card.addEventListener("keypress", e => { if (e.key === "Enter") openModal(Number(card.dataset.id)); });
  });

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const el = document.getElementById("pagination");
  if (totalPages <= 1){ el.innerHTML = ""; return; }
  let html = `<button ${currentPage===1?'disabled':''} data-page="${currentPage-1}">‹ Prev</button>`;
  const windowSize = 2;
  for (let p = 1; p <= totalPages; p++){
    if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= windowSize){
      html += `<button class="${p===currentPage?'active':''}" data-page="${p}">${p}</button>`;
    } else if (Math.abs(p - currentPage) === windowSize + 1){
      html += `<span style="padding:0 4px;color:var(--steel);">…</span>`;
    }
  }
  html += `<button ${currentPage===totalPages?'disabled':''} data-page="${currentPage+1}">Next ›</button>`;
  el.innerHTML = html;
  el.querySelectorAll("button[data-page]").forEach(btn => {
    btn.addEventListener("click", () => {
      currentPage = Number(btn.dataset.page);
      renderGrid();
      window.scrollTo({top: 0, behavior:"smooth"});
    });
  });
}

function openModal(id){
  if (window.location.hash === "#v" + id){
    renderModal(id);
  } else {
    window.location.hash = "v" + id;
  }
}

function renderModal(id){
  const l = allListings.find(x => x.id === id);
  if (!l) return;
  modalImages = l.images;
  modalIndex = 0;
  document.getElementById("mTitle").textContent = l.title;
  document.getElementById("mPrice").textContent = l.priceDisplay ? "₹" + l.priceDisplay : "Call for price";
  document.getElementById("mTags").innerHTML = [l.brand, l.type, l.year, l.km ? l.km+" km" : "", l.tyre, l.owners ? l.owners+" Owner" : "", l.permit]
    .filter(Boolean).map(t => `<span>${escapeHtml(t)}</span>`).join("");
  document.getElementById("mDesc").textContent = l.description || "";
  document.getElementById("mSeller").textContent = l.sellerName + (l.location ? " — " + l.location : "");
  const phone = l.phone || "";
  document.getElementById("mCall").href = phone ? `tel:${phone}` : "#";
  document.getElementById("mWa").href = phone ? `https://wa.me/${phone.replace(/^\+?/,"91")}` : "#";
  renderGallery();
  document.getElementById("overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function renderGallery(){
  const img = document.getElementById("galleryImg");
  img.onerror = () => { img.onerror = null; img.src = PLACEHOLDER_IMG; };
  img.src = modalImages[modalIndex];
  const dotsEl = document.getElementById("galDots");
  dotsEl.innerHTML = modalImages.map((_, i) => `<span class="${i===modalIndex?'active':''}"></span>`).join("");
  const showNav = modalImages.length > 1;
  document.getElementById("galPrev").style.display = showNav ? "block" : "none";
  document.getElementById("galNext").style.display = showNav ? "block" : "none";
}

function closeModal(){
  // Back button jaisa hi behave kare: agar hash set hai to history se hataein,
  // taaki phone/browser ka "back" button aur yahan ka X button ek jaisa kaam karein.
  if (window.location.hash){
    history.back();
  } else {
    hideModal();
  }
}

function hideModal(){
  document.getElementById("overlay").classList.remove("open");
  document.body.style.overflow = "";
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.getElementById("galPrev").addEventListener("click", () => { modalIndex = (modalIndex - 1 + modalImages.length) % modalImages.length; renderGallery(); });
document.getElementById("galNext").addEventListener("click", () => { modalIndex = (modalIndex + 1) % modalImages.length; renderGallery(); });

// Phone/browser ka BACK button dabane par: agar detail popup khula hai to sirf
// wahi band ho (URL ka #v<id> hash hatte hi), poori website se bahar na nikle.
window.addEventListener("hashchange", () => {
  const m = window.location.hash.match(/^#v(\d+)$/);
  if (m){
    renderModal(Number(m[1]));
  } else {
    hideModal();
  }
});

// Agar koi seedha kisi listing ke link (#v3 jaisa) se aaya ho, use load hote hi khol dein.
function checkInitialHash(){
  const m = window.location.hash.match(/^#v(\d+)$/);
  if (m) renderModal(Number(m[1]));
}

loadListings().then(checkInitialHash);
</script>
